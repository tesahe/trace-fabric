[package]
name = "scraper-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.3"
tokio = { version = "1.51.0", features = ["full"] }
zmq = "0.10.0"
dotenvy = "0.15"

# SQLx with encryption
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }

# Rust data types 
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"

# Async HTTP client with internal connection pool, pure-Rust tls 
# no OS dependencies
reqwest = { version = "0.12.0", features = ["json", "rustls-tls"] }

# governor Token Bucket Rate Limiter, uses .await for rate limiting on  
# target servers.
governor = "0.8"

# Structured logging to upgrade from "println!" for current Spikes
tracing = "0.1"
# logging backend / subscriber to stdout for runtime control
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mpsc = "0.2.6"
serde = { version = "1.0.228", features = ["derive"] }
scraper = "0.24"
url = "2.5"
regex = "1.11"


[build-dependencies]
prost-build = "0.14.3"

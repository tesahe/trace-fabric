[package]
name = "scraper-engine"
version = "0.1.0"
edition = "2024"
description = "Scraper Engine for Trace Fabric"
license = "Apache-2.0"

[dependencies]
# --- Async runtime ---
tokio = { version = "1.51.0", features = ["full"] }


# --- Transport: ZeroMQ & Protocol Buffers --- 
zmq = "0.10.0"
prost = "0.14.3"


# --- HTTP client -- 
# Internal connection pool, pure-Rust tls, no OS dependencies
reqwest = { version = "0.12.0", features = ["json", "rustls-tls"] }


# --- Scraping --- 
scraper = "0.24"
url = "2.5"
regex = "1.11"


# --- Rate limiting --- 
# 
governor = "0.8"


# --- Serialization / data types --- 
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

# --- CLI --- 
clap = { version = "4.5", features = ["derive"] }

# -- Config --- 
dotenvy = "0.15"

# --- Logging --- 
# Structured logging to upgrade from "println!" for current Spikes
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


# --- DB Persistence (DISABLED) --- 
# SQLx with encryption vaulted currently
#sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }


[build-dependencies]
# compiles .proto into Rust types at build time.
prost-build = "0.14.3"

[dev-dependencies]
# for running tests
insta = "1"

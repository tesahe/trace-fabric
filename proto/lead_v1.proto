syntax = "proto3";

package tracefabric;

message RawLead {

  string run_id = 37;

  // Identity
  string id = 1;
  string timestamp = 2;

  // Canonical lead identity / routing
  string source_url = 3;   // canonical website URL used for crawl routing
  string initial_url = 4;  // first requested URL
  string final_url = 5;    // final URL after redirects

  // Discovery / provenance / compliance
  string discovery_source = 6;          // brave, foursquare, manual, etc.
  string target_industry = 7;
  string target_location = 8;
  bool crawl_allowed = 9;
  string crawl_disallowed_reason = 10;
  bool is_no_website_opportunity = 11;

  //double check this 
  string provider_fsq_id = 12;          // only retained provider ID currently allowed by policy

  // Website-derived business fields only , nullable / set to empty string if not found
  string company_name = 13;
  string category = 14;
  string phone_number = 15;
  string address = 16;

  // Optional provenance/confidence metadata
  string provider_provenance_json = 17;
  string website_provenance_json = 18;
  float location_confidence = 19;
  float category_confidence = 20;

  // Fetch metadata
  int32 http_status = 21;
  bool is_https = 22;
  int32 redirect_count = 23;
  int32 fetch_duration_ms = 24;
  int32 response_size_bytes = 25;
  string content_type = 26;

  repeated Header response_headers = 27;

  // Homepage content artifacts
  string raw_html = 28;
  string text_content = 29;
  string page_title = 30;

  // URL/resource inventories from homepage
  repeated UrlArtifact anchor_hrefs = 31;
  repeated UrlArtifact script_srcs = 32;
  repeated UrlArtifact stylesheet_hrefs = 33;

  // Root-level technical file checks
  RootFile robots_txt = 34;
  RootFile sitemap_xml = 35;

  // Optional homepage manifest
  string manifest_url = 36;
}


// HTTP header key-value pair
message Header {
  string key = 1;
  string value = 2;
}

// Same-domain , reused for anchors/scripts/stylesheets
message UrlArtifact {
  string url = 1; // always unique url
  bool is_internal = 2; // same domain as base URL? - internal web page
  string label = 3; // visible link text not the path
}

message RootFile {
  string path = 1;
  int32 http_status = 2;
  bool exists = 3;
  string content_type = 4;
  string body = 5;

}



message LeadBatch {
  repeated RawLead leads = 1;
}